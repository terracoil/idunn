[project]
name = "idunn"
authors = [{ name = "Steven Miers", email = "steven.miers@gmail.com" }]
readme = "README.md"
version = "2.0.0"
description = "Constructor-time dependency inversion for Python: three decorators, one discovery call."
license = "MIT"
requires-python = ">=3.11,<4.0"
keywords = ["dependency-injection", "inversion-of-control", "ioc", "decorators", "protocols"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Typing :: Typed",
]

[project.urls]
Homepage = "https://github.com/terracoil/idunn/blob/master/README.md"
Repository = "https://github.com/terracoil/idunn"
Documentation = "https://github.com/terracoil/idunn/tree/master/docs"
Changelog = "https://github.com/terracoil/idunn/blob/master/CHANGELOG.md"
Freyja = "https://github.com/terracoil/freyja"
Modgud = "https://github.com/terracoil/modgud"

[tool.poetry]
# The wheel needs only the package; the changelog rides in the sdist beside README and LICENSE.
include = [{ path = "CHANGELOG.md", format = "sdist" }]

[tool.poetry.group.dev.dependencies]
pytest = ">=8.0,<10.0"
ruff = ">=0.8,<1.0"
mypy = ">=1.13,<3.0"
freyja = "^2.0.2"
pytest-cov = "^7.1.0"

[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"

[tool.mypy]
python_version = "3.11"
strict = true
mypy_path = "idunn"
cache_dir = "tmp/.mypy_cache"
files = ["idunn", "tests", "examples"]

[tool.pytest.ini_options]
cache_dir = "tmp/.pytest_cache"
minversion = "8.0"
testpaths = ["tests"]
addopts = ["-ra", "--strict-config", "--strict-markers"]
markers = ["integration: end-to-end tests that drive a generated package through the public API"]
